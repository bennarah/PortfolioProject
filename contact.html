<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <section id="contact">
      <h2>Let's Connect</h2>
      <p>I’d love to hear from you! Whether it's a project, a question, or just to say hi.</p>

      <div class="contact-flex">
        <div class="contact-form">
          <form action="https://formspree.io/f/YOUR_ID" method="POST">
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="_replyto" placeholder="Your email" required>
            <textarea name="message" placeholder="Your message" required></textarea>
            <button type="submit" class="button">Send Message</button>

            <div class="social-links">
              <a href="https://github.com/bennarah" class="button" target="_blank">GitHub</a>
              <a href="https://www.linkedin.com/in/bassma-ennarah" class="button" target="_blank">LinkedIn</a>
            </div>
          </form>
        </div>

        <div class="phone-preview">
          <div class="phone-frame">
            <img src="assets/images/LinkedInSS.JPG" alt="Bassma's LinkedIn profile screenshot">
          </div>
          <a href="https://www.linkedin.com/in/bassma-ennarah" class="button" target="_blank">Let's Connect!</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
